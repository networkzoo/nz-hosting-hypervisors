poll_interval: 60          # seconds
db_path: data/events.db

# Dead-man's switch: pinged after every complete poll cycle (see deadman/README.md). Optional.
# deadman_url_env: DEADMAN_URL

alerts:
  fail_threshold: 2        # consecutive failed polls before alerting (avoids blips)
  stale_days: 30           # Proxmox only: alert if no update is seen for this many days (0 = off).
                           # Reminds every 7 days while overdue. Override per cluster with stale_days: N.
  # Teams: create a channel Workflow ("Post to a channel when a webhook request is received"),
  # put its URL in .env as TEAMS_WEBHOOK, then:
  # webhook_url_env: TEAMS_WEBHOOK
  # webhook_format: teams            # "text" for Slack / Mattermost style webhooks
  smtp:
    host: smtp.example.com
    port: 587
    starttls: true
    username: alerts@example.com
    password_env: SMTP_PASSWORD
    from: alerts@example.com
    to: [you@example.com]

clusters:
  # Proxmox: create a token (Datacenter > Permissions > API Tokens) with the
  # PVEAuditor role. Add Sys.Modify only if you want "updates pending" counts.
  - name: PVE-Site1
    type: proxmox
    url: https://pve1.example.com:8006
    token_id: monitor@pve!dashboard
    token_secret_env: PVE1_TOKEN
    verify_tls: false
    link: https://pve1.example.com:8006   # or your SSO login URL
    # ssh_user: root                      # used by the "SSH (copy)" buttons

  # Scale Computing HyperCore: use a read-only (non-admin) local or SSO-backed user.
  - name: Scale-Site1
    type: scale
    url: https://scale1.example.com
    username: monitor
    password_env: SCALE1_PASSWORD
    verify_tls: false
