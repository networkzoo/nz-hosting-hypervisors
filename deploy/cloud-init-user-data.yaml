#cloud-config
# Rendered by proxmox-create-vm.sh (placeholders: __HOSTNAME__, __SSH_KEY__, __ADMIN_CIDR__).
hostname: __HOSTNAME__
manage_etc_hosts: true
timezone: Pacific/Auckland

users:
  - name: ops
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_KEY__

ssh_pwauth: false
package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent
  - docker.io
  - docker-compose-v2
  - git
  - ufw
  - unattended-upgrades
  - chrony

write_files:
  - path: /etc/apt/apt.conf.d/52dashboard-unattended
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

runcmd:
  - systemctl enable --now qemu-guest-agent docker chrony
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow from __ADMIN_CIDR__ to any port 22 proto tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - install -d -o ops -g ops /opt/dashboard
  - echo "cloud-init finished $(date)" > /var/log/dashboard-provisioned

power_state:
  mode: reboot
  condition: true
