services:
  dashboard:
    build: .
    restart: unless-stopped
    expose: ["8080"]                 # only reachable by caddy, not the network
    env_file: .env                   # PVE1_TOKEN=..., SCALE1_PASSWORD=..., SMTP_PASSWORD=...
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/srv/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["443:443"]
    depends_on: [dashboard]
    environment:
      - DASH_HOSTS=${DASH_HOSTS:-localhost}   # from .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/auth:ro      # holds auth.caddy (created by deploy/set-password.sh)
      - caddy_data:/data

volumes:
  caddy_data:
