services:
  dashboard:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]   # put your SSO reverse proxy in front
    env_file: .env                   # PVE1_TOKEN=..., SCALE1_PASSWORD=..., SMTP_PASSWORD=...
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/srv/data
