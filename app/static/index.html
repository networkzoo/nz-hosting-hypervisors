<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Dashboard</title>
<link rel="icon" type="image/png" href="/static/NZ-256.png">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2230; --muted:#667085; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --line:#e4e7ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2030; --text:#e6e9f0; --muted:#98a2b3; --line:#2b3245; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px system-ui,sans-serif; }
  header.top { padding:14px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header.top img { height:36px; width:36px; border-radius:6px; }
  h1 { font-size:18px; margin:0; } #summary { color:var(--muted); }
  main { padding:0 16px 16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; border-left:5px solid var(--ok); min-width:0; }
  .card.down { border-left-color:var(--bad); } .card.degraded { border-left-color:var(--warn); }
  .row { display:flex; justify-content:space-between; gap:8px; margin:4px 0; } .row > span:last-child { text-align:right; overflow-wrap:anywhere; }
  .muted { color:var(--muted); } .title { font-weight:600; font-size:15px; overflow-wrap:anywhere; }
  .badge { font-size:11px; padding:1px 6px; border-radius:9px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; align-self:flex-start; }
  .err { color:var(--bad); font-size:12px; word-break:break-word; }
  button, a.btn { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:none; color:var(--text); cursor:pointer; text-decoration:none; }
  .actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  section { padding:0 16px 20px; }
  h2 { font-size:14px; margin:0 0 8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  h2 small { font-weight:400; color:var(--muted); }
  ul.plain { list-style:none; margin:0; padding:0; } li { margin:3px 0; font-size:13px; overflow-wrap:anywhere; }
  .problems { border:1px solid var(--bad); border-radius:8px; padding:10px 12px; background:var(--card); }
  .problems.none { border-color:var(--line); color:var(--muted); }
  .problems li::before { content:"●"; color:var(--bad); margin-right:6px; }
  .problems li.warn::before { color:var(--warn); }
  .problems.warnonly { border-color:var(--warn); }
  .row .stale { color:var(--warn); font-weight:600; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; max-width:90vw; overflow-wrap:anywhere; }
  #toast.on { opacity:.95; }
  .ev.new { color:var(--text); font-weight:600; } .ev.old { color:var(--muted); } .ev.cleared { opacity:.55; font-style:italic; }
  details.vms { margin:6px 0 0; } details.vms summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .vmlist { max-height:220px; overflow:auto; margin-top:6px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .vmlist h4 { margin:6px 0 2px; font-size:12px; color:var(--muted); font-weight:600; } .vmlist h4:first-child { margin-top:0; }
  .vmlist li::before { content:"●"; margin-right:6px; color:var(--ok); } .vmlist .off li::before { color:var(--muted); }
  .vmlist .kind { font-size:11px; color:var(--muted); margin-left:4px; }
  #frame { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10; }
  #frame.on { display:flex; } #frame iframe { flex:1; border:0; }
  #frame header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<header class="top"><img id="logo" src="/static/NZ-256.png" alt="" onerror="this.style.display='none'"><h1>Fleet Dashboard</h1><span id="summary"></span></header>
<section><div id="problems" class="problems none">Loading…</div></section>
<main id="grid"></main>
<section style="padding-top:16px">
  <h2>Recent events <small id="evmeta"></small>
    <button id="clear" type="button">Clear</button>
    <button id="showcleared" type="button" hidden></button></h2>
  <ul id="events" class="plain"></ul>
</section>
<div id="toast" role="status"></div>
<div id="frame"><header><button id="close" type="button">← Back</button><b id="ftitle"></b><a class="btn" id="fnew" target="_blank" rel="noopener">Open in new tab</a>
<span class="muted">Blank frame? The site blocks embedding — use the new tab.</span></header><iframe id="fi" title="Cluster console"></iframe></div>
<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ago = ts => { if (!ts) return "never"; const s = Math.round(Date.now()/1000 - ts); return s < 90 ? s+"s ago" : s < 5400 ? Math.round(s/60)+"m ago" : Math.round(s/3600)+"h ago"; };

const dayWord = ts => { const d = Math.floor((Date.now()/1000 - ts) / 86400); return d <= 0 ? "today" : d === 1 ? "1 day ago" : d + " days ago"; };
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2800); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {   // older/blocked clipboard API: fall back to a hidden textarea
    const ta = el("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); if (ok) return true;
  } catch (e) {}
  window.prompt("Copy this command:", text); return false;
}

// Per-person state lives in this browser only (localStorage). Every access is guarded: it can be blocked.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
};
const nowS = Date.now() / 1000;
// "New" = arrived since the previous page load. Auto-refresh doesn't age them; a reload does.
const prevSeen = store.get("seenUntil");
const newSince = prevSeen === null ? nowS : parseFloat(prevSeen);
store.set("seenUntil", nowS);
let clearedBefore = parseFloat(store.get("clearedBefore") || "0");
let showCleared = false;
let lastEvents = [];

const openVMs = new Set();   // which cards have their VM list expanded; survives the 15s redraw

function vmDetails(c) {
  if (c.vms == null) return null;
  const d = el("details", "vms");
  if (openVMs.has(c.name)) d.open = true;
  d.addEventListener("toggle", () => { d.open ? openVMs.add(c.name) : openVMs.delete(c.name); });
  d.append(el("summary", null, `Show VMs (${c.vms_running}/${c.vms_total} running)`));
  const box = el("div", "vmlist");
  const run = c.vms.filter(v => v.running), off = c.vms.filter(v => !v.running);
  const group = (title, list, cls) => {
    box.append(el("h4", null, `${title} (${list.length})`));
    const ul = el("ul", "plain " + cls);
    if (!list.length) ul.append(el("li", "muted", "none"));
    for (const v of list) {
      const li = el("li", null, v.name);
      if (v.kind === "ct") li.append(el("span", "kind", "container"));
      if (!v.running && v.state && v.state !== "stopped") li.append(el("span", "kind", v.state));
      ul.append(li);
    }
    box.append(ul);
  };
  group("Running", run, "on"); group("Not running", off, "off");
  d.append(box);
  return d;
}

// Proxmox console deep link to a node's Updates page (tab ids can differ between PVE versions).
const PVE_UPDATES_HASH = ":4:31::::7::";
const pveUpdatesUrl = (c, node) => `${c.url}/#v1:0:=node%2F${encodeURIComponent(node)}${PVE_UPDATES_HASH}`;
const openConsole = (title, url) => { $("#ftitle").textContent = title; $("#fi").src = url; $("#fnew").href = url; $("#frame").classList.add("on"); };

function card(c) {
  const offline = (c.nodes||[]).filter(n => !n.online);
  const cls = !c.reachable ? "down" : (offline.length || c.drives_unhealthy) ? "degraded" : "";
  const d = el("div", "card " + cls);
  const t = el("div", "row"); t.append(el("span","title",c.name), el("span","badge",c.type==="proxmox"?"Proxmox":"Scale"));
  d.append(t);
  if (!c.reachable) {
    d.append(el("div","err","UNREACHABLE — " + c.error), el("div","muted","Last seen " + ago(c.last_ok)));
  } else {
    const on = c.nodes.length - offline.length;
    const rows = [
      ["Nodes", `${on}/${c.nodes.length} online` + (offline.length ? " (" + offline.map(n=>n.name).join(", ") + " down)" : "")],
      ["VMs", c.vms_total == null ? "–" : `${c.vms_running}/${c.vms_total} running`],
      ["Memory", c.mem_pct == null ? "–" : c.mem_pct + "%"],
      ["CPU", c.cpu_pct == null ? "–" : c.cpu_pct + "%"],
      ["Version", c.version || "–"],
    ];
    if (c.updated_at) rows.push(["Last updated", dayWord(c.updated_at) + (c.stale ? " ⚠" : ""), c.stale]);
    else if (c.tracking_since) rows.push(["Last updated", c.stale ? `no change in ${Math.floor(c.days_since_update)} days ⚠` : `unknown (watching since ${new Date(c.tracking_since*1000).toLocaleDateString()})`, c.stale]);
    if (c.drives_unhealthy) rows.push(["Drives unhealthy", String(c.drives_unhealthy)]);
    if (c.updates_pending != null) rows.push(["Updates pending", String(c.updates_pending)]);
    for (const [k,v,warn] of rows) { const r = el("div","row"); const val = el("span", warn ? "stale" : null, v); if (k === "Last updated" && c.last_change) val.title = c.last_change; r.append(el("span","muted",k), val); d.append(r); }
    const vd = vmDetails(c); if (vd) d.append(vd);
    if (c.type === "proxmox" && c.url) {
      const sshNodes = c.nodes.filter(n => n.ip);
      if (sshNodes.length) {
        const sh = el("div", "actions");
        sh.append(el("span", "muted", "SSH (copy):"));
        for (const n of sshNodes) {
          const cmd = `ssh ${c.ssh_user || "root"}@${n.ip}`;
          const b = el("button", null, n.name); b.type = "button"; b.title = cmd;
          b.onclick = async () => { const ok = await copyText(cmd); if (ok) toast(`Copied: ${cmd}`); };
          sh.append(b);
        }
        d.append(sh);
      }
      const u = el("div", "actions");
      u.append(el("span", "muted", "Updates:"));
      for (const n of c.nodes.filter(n => n.online)) {
        const b = el("button", null, n.updates == null ? n.name : `${n.name} (${n.updates})`); b.type = "button";
        b.title = `Open ${n.name}'s Updates page in the console (you'll be asked to log in)`;
        b.onclick = () => openConsole(`${c.name} / ${n.name} — Updates`, pveUpdatesUrl(c, n.name));
        u.append(b);
      }
      d.append(u);
    }
  }
  d.append(el("div","muted","Checked " + ago(c.checked_at)));
  const a = el("div","actions");
  const open = el("a","btn","Open"); open.href = c.link; open.target = "_blank"; open.rel = "noopener";
  const emb = el("button",null,"Embed"); emb.type = "button";
  emb.onclick = () => openConsole(c.name, c.link);
  a.append(open, emb); d.append(a);
  return d;
}

function renderProblems(cl) {
  const items = [];   // {t: text, warn: true for "needs attention" rather than "broken"}
  for (const c of cl) {
    if (!c.reachable) items.push({t: `${c.name}: unreachable (${c.error})`});
    else {
      for (const n of c.nodes.filter(n => !n.online)) items.push({t: `${c.name}: node ${n.name} is offline`});
      if (c.drives_unhealthy) items.push({t: `${c.name}: ${c.drives_unhealthy} drive(s) reported unhealthy`});
      if (c.stale) items.push({t: `${c.name}: no update detected in ${Math.floor(c.days_since_update)} days (limit ${c.stale_limit})`, warn: true});
    }
  }
  const box = $("#problems");
  box.replaceChildren();
  const broken = items.some(i => !i.warn);
  box.className = "problems" + (items.length ? (broken ? "" : " warnonly") : " none");
  if (!items.length) { box.append(document.createTextNode("No active problems.")); return 0; }
  box.append(el("h2", null, `Active problems (${items.length})`));
  const ul = el("ul", "plain"); for (const i of items) ul.append(el("li", i.warn ? "warn" : null, i.t)); box.append(ul);
  return items.length;
}

function renderEvents() {
  const visible = lastEvents.filter(e => e.ts > clearedBefore);
  const hidden = lastEvents.length - visible.length;
  const list = showCleared ? lastEvents : visible;
  const ul = $("#events"); ul.replaceChildren();
  if (!list.length) ul.append(el("li", "muted", hidden ? "All events cleared." : "No events yet."));
  for (const e of list) {
    const cls = e.ts <= clearedBefore ? "ev cleared" : e.ts > newSince ? "ev new" : "ev old";
    ul.append(el("li", cls, `${new Date(e.ts*1000).toLocaleString()} — ${e.kind.toUpperCase()}: ${e.message}`));
  }
  const sc = $("#showcleared");
  sc.hidden = hidden === 0;
  sc.textContent = showCleared ? "Hide cleared" : `Show cleared (${hidden})`;
  $("#clear").disabled = visible.length === 0;
  $("#evmeta").textContent = visible.some(e => e.ts > newSince) ? "bold = new since your last visit" : "";
}

async function refresh() {
  try {
    const [cl, ev] = await Promise.all([fetch("/api/clusters").then(r=>r.json()), fetch("/api/events").then(r=>r.json())]);
    $("#grid").replaceChildren(...cl.map(card));
    const n = renderProblems(cl);
    $("#summary").textContent = `${cl.length} clusters · ${n ? n + " active problem" + (n > 1 ? "s" : "") : "all healthy"}`;
    lastEvents = ev; renderEvents();
  } catch (e) { $("#summary").textContent = "Dashboard API unreachable"; }
}
$("#clear").onclick = () => { clearedBefore = Date.now() / 1000; store.set("clearedBefore", clearedBefore); renderEvents(); };
$("#showcleared").onclick = () => { showCleared = !showCleared; renderEvents(); };
$("#close").onclick = () => { $("#frame").classList.remove("on"); $("#fi").src = "about:blank"; };
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
